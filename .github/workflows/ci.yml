# Конвейер сервиса уведомлений.
#
# Базы у сервиса нет: он слушает брокеры и рассылает по каналам, поэтому
# из окружения нужны только RabbitMQ и NATS.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          # Учётная запись своя, не guest: guest пускают только с петли,
          # а подключение из работы приходит через мост docker.
          RABBITMQ_DEFAULT_USER: mirea
          RABBITMQ_DEFAULT_PASS: mirea
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      nats:
        image: nats:2.10-alpine
        ports: ["4222:4222"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::не отформатировано: $unformatted"; exit 1; }

      - name: Статический анализ
        run: go vet ./...

      - name: Модульные тесты
        run: go test ./...

      - name: Интеграционные тесты
        # Отдельный признак сборки: без него go test ./... требовал бы
        # брокеры у каждого, кто просто хочет прогнать модульные тесты.
        #
        # NOTIFICATION_REQUIRE_BROKER запрещает пропускать тесты брокеров:
        # здесь они подняты заведомо, и пропуск означал бы не «нечего
        # проверять», а незамеченную поломку.
        env:
          NOTIFICATION_REQUIRE_BROKER: "1"
          NOTIFICATION_TEST_AMQP_URL: amqp://mirea:mirea@localhost:5672/
          NOTIFICATION_TEST_NATS_URL: nats://localhost:4222
        run: go test -tags integration ./...

      - name: Образ собирается
        run: docker build -t notification-service:ci .
